<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monthly Ledger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#1a2123">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
input,select{font-size:16px}
/* Layout: one narrow phone-first column read top to bottom like a statement: income, bills, savings, subtotal, then the spending log that draws it down. */
:root{
  /* Single dark look from the supplied palette: ink #1A2123, slate #444556, grey-violet #7E7B83, mauve #C0ADB5, blush #E5D3CE */
  --bg:#1a2123; --surface:#232b2e; --raised:#2c3438; --ink:#e5d3ce; --muted:#a39fa8; --line:#3a3f4c;
  --accent:#c0adb5; --accent-ink:#1a2123; --accent-soft:#444556;
  --save:#e5d3ce; --save-soft:#444556;
  --warn:#dcae84; --bad:#e8949a; --bad-soft:#43303a; --good:#a8cbb6; --track:#343b45;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}

body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:700 1.5rem/1.1 var(--display);margin:0;letter-spacing:-.01em}
.tabs{display:flex;background:var(--track);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.3)}

/* statement */
.statement{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.statement .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:600;opacity:.85}
.month-name{font:700 1.15rem var(--display)}
.left-big{font:500 2.2rem/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.equation{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid color-mix(in srgb,var(--accent-ink) 25%,transparent);padding-top:12px}
.equation div{display:flex;flex-direction:column;gap:2px;min-width:0}
.equation .num{font-size:.92rem;overflow-wrap:anywhere}

section.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2{font:700 1.05rem var(--display);margin:0}
h3.sub-head{font:600 .74rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 0;display:flex;justify-content:space-between;gap:8px}
.card-head .num{color:var(--muted);font-size:.88rem}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.divider{border-top:1px solid var(--line);margin:4px 0}

/* income */
.pay-main{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pay-main label{font-weight:600;font-size:1.02rem}
.pay-main input{font:500 1.35rem var(--mono);width:8em}
.pay-sub{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.86rem}
.pay-sub input{font-size:.86rem;width:8em;color:var(--muted)}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .label{min-width:0;overflow-wrap:anywhere}
.row .sub{display:block;color:var(--muted);font-size:.78rem}
.amt-in{width:6.5em;text-align:right;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.amt-in:hover{border-color:var(--line)}
.amt-in:focus{border-color:var(--accent);background:var(--bg)}
.x{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:6px;font-weight:600}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.check{width:20px;height:20px;accent-color:var(--accent)}
.row.paid .label{color:var(--muted);text-decoration:line-through}

/* budgeted bills */
.bb{border-top:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:6px}
.bb:first-of-type{border-top:0}
.bb-line{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
.toggle{border:0;background:var(--track);width:26px;height:26px;border-radius:6px;font-weight:700;color:var(--muted)}
.bb-line .label{font-weight:600;min-width:0;overflow-wrap:anywhere}
.meter{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.over i{background:var(--bad)}
.meter.near i{background:var(--warn)}
.bb-meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.pos{color:var(--good);font-weight:600}
.neg{color:var(--bad);font-weight:600}
.charges{margin-left:34px;display:flex;flex-direction:column;gap:2px;padding:6px 10px;background:var(--bg);border-radius:8px}
.charge{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:.88rem;padding:3px 0}
.charge .label{min-width:0;overflow-wrap:anywhere}

/* savings */
.sv{border-top:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:4px}
.sv:first-of-type{border-top:0}
.sv-line{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
.skip{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer}
.sv.skipped .label{color:var(--muted)}
.sv.skipped .amt-in{color:var(--muted);text-decoration:line-through}
.sv.skipped .skip-note{display:block}
.skip-note{display:none;font-size:.78rem;color:var(--muted);margin-left:36px}
.sv-line .label{font-weight:600;min-width:0;overflow-wrap:anywhere}
.sv-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.sv-meta .amt-in{font-size:.8rem;width:7em;color:var(--muted)}
.sv-after{color:var(--save);font-weight:600}
.leftover-to{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.leftover-to select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px}

.add{display:flex;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px dashed var(--line)}
.add.tight{border-top:0;padding-top:4px}
.add input,.add select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
.charges .add input{background:var(--surface);padding:6px 8px}
.add .grow{flex:1 1 9em}
.add .money{flex:0 1 7em;font-family:var(--mono)}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:.88rem}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.back{background:var(--save-soft);color:var(--ink)}
.btn.danger{background:var(--bad);color:var(--accent-ink)}

/* subtotal */
.subtotal{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:.92rem}
.kv span:first-child{min-width:0;overflow-wrap:anywhere}
.kv.muted{color:var(--muted)}
.kv.total{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:600;font-size:1.05rem}
.kv.total .num{font-size:1.2rem}

.tx-date{font-size:.76rem;color:var(--muted);width:4.6em;line-height:1.25}
.tx-amt.in{color:var(--good)}

.reset{display:flex;flex-direction:column;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:14px}
.reset p{margin:0}
.confirm{display:flex;gap:8px;flex-wrap:wrap}

/* history */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hist summary{list-style:none;cursor:pointer;padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.hist summary::-webkit-details-marker{display:none}
.hist .m{font:700 1.05rem var(--display)}
.hist .net{font-size:1.05rem}
.hist .net.neg{color:var(--bad)}
.hist .mini{grid-column:1/-1;color:var(--muted);font-size:.8rem}
.hist .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.hist h3{font:600 .74rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.hist .kv{font-size:.88rem}

.plus{border:0;background:var(--accent);color:var(--accent-ink);width:32px;height:32px;border-radius:50%;font:700 1.15rem/1 var(--body)}
.pend{display:block;font-size:.76rem;color:var(--muted)}
.big-form{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:10px}
.big-form .add input,.big-form .add select{background:var(--surface)}
.kv.expense{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:600}
.kv.expense + .kv.total{border-top:0;margin-top:0;padding-top:4px}
.setup{display:flex;flex-direction:column;gap:12px}
.setup-body{display:flex;flex-direction:column;gap:16px}
.setup-toggle{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.setup-toggle{grid-template-columns:1fr auto}
.setup-toggle .chev{grid-column:2;grid-row:1/span 2;color:var(--muted);transform:rotate(-90deg)}
.setup-toggle[aria-expanded="true"] .chev{transform:rotate(0deg)}
.setup-title{grid-column:1;grid-row:1}
.setup-sum{grid-column:1;grid-row:2}
@media (prefers-reduced-motion:no-preference){.setup-toggle .chev{transition:transform .2s ease}}
.setup-title{font:700 1.05rem var(--display)}
.setup-sum{font-size:.8rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.big-item{background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:8px 12px 4px}
.big-tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.acct-row{cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;border-radius:6px}
.acct-row:hover{background:var(--raised)}
.acct-edit{display:flex;gap:6px;align-items:center;padding:4px 0;flex-wrap:wrap}
.acct-edit input{flex:1 1 8em;min-width:0;border:1px solid var(--accent);background:var(--bg);border-radius:8px;padding:6px 10px}
.picks{display:flex;flex-direction:column;gap:2px}
.pick{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.muted-n{color:var(--muted);font-size:.85em}
.btn:disabled{opacity:.5;cursor:default}
.hist-title{font:700 1.05rem var(--display);margin:4px 0 0}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:12px}
.status{font-size:.78rem;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s ease}}

/* ---------- holiday themes ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
html[data-holiday] #fx{display:block}
.wrap{position:relative;z-index:1}
.toast{z-index:5}
.brand{display:flex;flex-direction:column;gap:2px}
.title-row{display:flex;align-items:center;gap:10px}
html[data-tod="day"] #greeting{color:var(--accent)}
#season-ico{width:30px;height:30px;border-radius:8px;flex:none;box-shadow:0 2px 8px rgb(0 0 0/.3)}
#greeting{font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--save)}
.theme-pick{display:flex;justify-content:center;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.theme-pick select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 8px;font-size:.8rem;max-width:70vw}
html[data-holiday] section.card, html[data-holiday] .hist, html[data-holiday] .subtotal, html[data-holiday] .setup-toggle{background:color-mix(in srgb,var(--surface) 90%,transparent)}
html[data-holiday] .reset, html[data-holiday] .empty{background:color-mix(in srgb,var(--bg) 70%,transparent)}
html[data-holiday] .statement{position:relative;background:var(--hero);color:var(--hero-ink);box-shadow:0 12px 32px -14px var(--hero-glow)}
html[data-holiday] h1{color:var(--title)}

/* December: a string of lights along the top of the statement card */
html[data-holiday="winter"] .statement{margin-top:8px}
html[data-holiday="winter"] .statement::before,
html[data-holiday="winter"] .statement::after{content:"";position:absolute;left:14px;right:14px;top:-7px;height:14px;
  background:
    radial-gradient(circle at 50% 60%,#ff6f7d 3.4px,transparent 4.6px) 0 0/54px 14px repeat-x,
    radial-gradient(circle at 50% 60%,#ffd56e 3.4px,transparent 4.6px) 18px 0/54px 14px repeat-x,
    radial-gradient(circle at 50% 60%,#7fe3ad 3.4px,transparent 4.6px) 36px 0/54px 14px repeat-x}
html[data-holiday="winter"] .statement::before{filter:drop-shadow(0 0 4px rgb(255 230 160/.9))}
html[data-holiday="winter"] .statement::after{filter:brightness(1.5) blur(2px);opacity:0}
@media (prefers-reduced-motion:no-preference){
  html[data-holiday="winter"] .statement::after{animation:twinkle 2.6s steps(1) infinite}
  @keyframes twinkle{0%{opacity:0}25%{opacity:.9}50%{opacity:.2}75%{opacity:.7}}
}
</style>

</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="brand"><span id="greeting" hidden></span><div class="title-row"><img id="season-ico" alt="" width="30" height="30"><h1>Monthly Ledger</h1></div></div>
    <div class="tabs" role="tablist">
      <button id="tab-month" role="tab" aria-selected="true">This month</button>
      <button id="tab-history" role="tab" aria-selected="false">History</button>
    </div>
  </header>

  <main id="view-month"></main>
  <main id="view-history" hidden></main>
  <p class="status" id="status">Loading your ledger…</p>
  <div class="theme-pick"><label for="theme-sel">Theme</label><select id="theme-sel"><option value="auto">Automatic (holidays)</option><option value="default">Everyday</option><option value="autumn">Harvest (Thanksgiving)</option><option value="winter">Snowy night (December)</option></select></div>
</div>
<div class="toast" id="toast" hidden></div>

  function make(cfg,edge){
    const p={k:cfg.k,c:pick(cfg.c),x:rnd(-20,W+20),y:rnd(0,H),z:Math.random(),ph:rnd(0,TAU),rot:rnd(0,TAU),vr:rnd(-1.5,1.5),flip:rnd(0,TAU),vf:rnd(1.5,3.5),vx:0,a:1,age:0};

  function stepPart(p,dt){
    const D=KIND[p.k]; p.ph+=dt*1.3; p.age+=dt; p.rot+=p.vr*dt*(1+Math.abs(wind)/120); p.flip+=p.vf*dt;

  /* shapes */
  function star5(r,ir){ ctx.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?ir:r; i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);} ctx.closePath(); }

  function drawPart(p){

  /* ===== scene ===== */
  function bodyPos(){ const b=sc.body; return b ? {x:W*b.x, y:H*b.y, r:Math.min(W,H)*b.r+12} : null; }
  function drawSky(){
    const g=ctx.createLinearGradient(0,0,0,H); sc.sky.forEach((c,i)=>g.addColorStop(i/(sc.sky.length-1),c)); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    stars.forEach(s=>{ const tw=.55+.45*Math.sin(clock*s.sp+s.ph); ctx.globalAlpha=s.a*tw; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill();

    ctx.fillStyle=b.c; ctx.beginPath(); ctx.arc(P.x,P.y,P.r,0,TAU); ctx.fill();
    if(b.t==='moon'){ ctx.fillStyle='rgba(120,90,60,.18)'; [[-.3,-.2,.22],[.25,.15,.16],[-.05,.35,.12]].forEach(([a,c,r])=>{ ctx.beginPath(); ctx.arc(P.x+a*P.r,P.y+c*P.r,r*P.r,0,TAU); ctx.fill(); }); }
    if(b.t==='crescent'){ ctx.fillStyle=sc.sky[0]; ctx.beginPath(); ctx.arc(P.x+P.r*.42,P.y-P.r*.18,P.r*.9,0,TAU); ctx.fill(); }
  }
  function drawClouds(dt){

  }
  const hillY=(h,x)=>H-h.base-Math.sin(x*h.f+h.p)*h.a-Math.sin(x*h.f*2.3+h.p*1.7)*h.a*.3;

    if(city.length){ ctx.fillStyle=sc.city; city.forEach(b=>{ ctx.fillRect(b.x,H-b.h,b.w,b.h); });
      if(sc.night) city.forEach(b=>b.win.forEach(w=>{ const on=Math.sin(clock*w.sp+w.ph)>-.6; if(!on) return; ctx.fillStyle='rgba(255,214,140,.75)'; ctx.fillRect(b.x+w.x,H-b.h+w.y,2.5,3); })); }

  /* ----- lake, rowboat and fishing line ----- */
  const waterY=()=>H*(1-sc.lake.h);
  function drawLake(){

  let bite=0, nextBite=6;

    if(bite>0){ ctx.strokeStyle=`rgba(255,255,255,${.4*(bite/1.2)})`; ctx.beginPath(); ctx.ellipse(fx,fy+1,10+(1.2-bite)*14,3+(1.2-bite)*3,0,0,TAU); ctx.stroke(); }
  }
  function fishPath(s,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,s,s*.38,0,0,TAU); ctx.fill();

  /* ===== periodic moments ===== */
  const EV={
    fireworks(cfg){ const out=[]; const n=Math.random()<.35?2:1; for(let k=0;k<n;k++){
      const tx=rnd(W*.15,W*.85), ty=rnd(H*.1,H*.42), x0=tx+rnd(-50,50), c=pick(cfg.c), c2=pick(cfg.c), delay=k*rnd(.3,.8);

            for(let i=0;i<N;i++){ const a=i/N*TAU+rnd(-.05,.05), sp=ring?150:rnd(70,180); o.sparks.push({x:tx,y:ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:rnd(1.1,1.9),t:0,c:Math.random()<.7?c:c2}); } }

      o.draw=()=>{ if(o.t<0) return;
        if(!o.burst){ const p=o.t, x=x0+(tx-x0)*p, y=H+(ty-H)*(1-(1-p)*(1-p)); ctx.fillStyle='rgba(255,230,180,.9)'; ctx.beginPath(); ctx.arc(x,y,1.6,0,TAU); ctx.fill();
          ctx.strokeStyle='rgba(255,210,150,.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-(tx-x0)*.06,y+28); ctx.stroke(); return; }

    aurora(){ const o={t:0}; o.step=dt=>(o.t+=dt)<14; o.sky=1;
      o.draw=()=>{ const k=Math.sin(Math.min(1,o.t/14)*Math.PI);

          g.addColorStop(0,'rgba(120,255,200,0)'); g.addColorStop(.5,`rgba(${band?'130,200,255':'110,255,190'},${.16*k})`); g.addColorStop(1,'rgba(120,255,200,0)');

          for(let x=0;x<=W+10;x+=12){ const y=H*(.16+band*.08)+Math.sin(x*.006+o.t*.5+band)*30+Math.sin(x*.017-o.t*.3)*12; x?ctx.lineTo(x,y):ctx.moveTo(x,y); }

    rays(){ const o={t:0}; o.step=dt=>(o.t+=dt)<8; o.sky=1;
      o.draw=()=>{ const P=bodyPos()||{x:W/2,y:H*.85,r:30}, k=Math.sin(o.t/8*Math.PI), R=Math.hypot(W,H);
        ctx.save(); ctx.translate(P.x,P.y); ctx.rotate(o.t*.03); ctx.fillStyle=`rgba(255,220,160,${.09*k})`;

    heartburst(){ const cx=rnd(W*.2,W*.8), cy=rnd(H*.15,H*.6), hs=[];
      for(let i=0;i<16;i++){ const a=i/16*TAU; hs.push({x:cx,y:cy,vx:Math.cos(a)*rnd(60,110),vy:Math.sin(a)*rnd(60,110),s:rnd(4,8),c:pick(['#ff4f7e','#ff7aa8','#ffd1df'])}); }
      const o={t:0}; o.step=dt=>{ o.t+=dt; hs.forEach(h=>{ h.vx*=1-dt*1.5; h.vy=h.vy*(1-dt*1.5)-6*dt; h.x+=h.vx*dt; h.y+=h.vy*dt; }); return o.t<2.6; };

    lanterns(){ const cfg=sc.parts.find(p=>p.k==='lantern'); if(cfg) for(let i=0;i<9;i++) parts.push(make(cfg,true)); return []; },
    lightning(){ const cfg={k:'bat',c:['#0a060d']}; for(let i=0;i<6;i++){ const b=make(cfg,true); b.sp=rnd(140,200); b.y0=rnd(H*.15,H*.45); b.x+= -b.dir*rnd(0,120); parts.push(b); }
      const o={t:0}; o.step=dt=>(o.t+=dt)<.6;
      o.draw=()=>{ const a=o.t<.08?.32:(o.t>.16&&o.t<.24?.22:0); if(a){ ctx.fillStyle=`rgba(225,215,255,${a})`; ctx.fillRect(0,0,W,H); } }; return [o]; },
    fishjump(){ const y0=waterY(), x0=rnd(W*.1,W*.85), dir=Math.random()<.5?1:-1, span=rnd(50,90)*dir, hgt=rnd(40,75), dur=1.25,
      c=pick(['#c9d8a8','#e0b070','#9fc7c9']), s=rnd(9,13), o={t:0,rings:[]};
      o.step=dt=>{ const was=o.t; o.t+=dt; if(was<=0.001) o.rings.push({x:x0,t:0}); if(was<dur && o.t>=dur) o.rings.push({x:x0+span,t:0});
        o.rings.forEach(r=>r.t+=dt); return o.t<dur+1.6; };
      o.draw=()=>{ o.rings.forEach(r=>{ const a=Math.max(0,1-r.t/1.6); ctx.strokeStyle=`rgba(255,255,255,${.5*a})`; ctx.lineWidth=1.2;
          for(let k=0;k<2;k++){ const rr=6+r.t*28-k*9; if(rr>2){ ctx.beginPath(); ctx.ellipse(r.x,y0+12,rr,rr*.28,0,0,TAU); ctx.stroke(); } }
          if(r.t<.5){ for(let i=0;i<6;i++){ const a2=-Math.PI*(.15+i*.14), d=r.t*60; ctx.fillStyle=`rgba(220,240,255,${.8*(1-r.t*2)})`; ctx.beginPath(); ctx.arc(r.x+Math.cos(a2)*d*.6,y0+10+Math.sin(a2)*d-0+r.t*r.t*90,1.4,0,TAU); ctx.fill(); } } });
        if(o.t<dur){ const p=o.t/dur, x=x0+span*p, y=y0+12-4*hgt*p*(1-p), vy=-4*hgt*(1-2*p)/dur, vx=span/dur;
          ctx.save(); ctx.translate(x,y); ctx.rotate(Math.atan2(vy,vx)); if(dir<0) ctx.scale(1,-1); fishPath(s,c); ctx.restore(); } };
      return [o]; },
    birds(){ const out=[], n=(Math.random()*3|0)+3, y0=rnd(H*.08,H*.35), dir=Math.random()<.5?1:-1, dur=rnd(9,13), c=sc.night?'rgba(230,236,250,.7)':'rgba(40,48,64,.75)';
      for(let i=0;i<n;i++){ const off=i*rnd(.15,.3), dy=(i%2?1:-1)*Math.ceil(i/2)*rnd(10,16), o={t:-off};
        o.step=dt=>(o.t+=dt)<dur;
        o.draw=()=>{ if(o.t<0) return; const p=o.t/dur, x=dir>0?-30+p*(W+60):W+30-p*(W+60), y=y0+dy+Math.sin(o.t*1.3+i)*6, f=Math.sin(o.t*9+i)*5;
          ctx.strokeStyle=c; ctx.lineWidth=1.6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x-8,y-f); ctx.quadraticCurveTo(x-4,y-3-f*.4,x,y); ctx.quadraticCurveTo(x+4,y-3-f*.4,x+8,y-f); ctx.stroke(); };
        out.push(o); } return out; },
    shower(){ const o={t:0,dur:7,drops:[]}; for(let i=0;i<Math.round(W*H/2600);i++) o.drops.push({x:rnd(0,W),y:rnd(-H,H),v:rnd(420,620),l:rnd(8,16)});
      o.step=dt=>{ o.t+=dt; o.drops.forEach(d=>{ d.y+=d.v*dt; d.x-=d.v*.12*dt; if(d.y>H){ d.y=rnd(-40,0); d.x=rnd(0,W+60); } });
        if(o.t>=o.dur && !sc.night && !o.bow){ o.bow=1; live.push(...EV.rainbow()); } return o.t<o.dur; };
      o.draw=()=>{ const k=Math.min(1,o.t/1.2,(o.dur-o.t)/1.2); ctx.fillStyle=`rgba(${sc.night?'40,50,80':'90,110,140'},${.16*k})`; ctx.fillRect(0,0,W,H);
        ctx.strokeStyle=sc.night?`rgba(190,210,240,${.45*k})`:`rgba(255,255,255,${.6*k})`; ctx.lineWidth=1; ctx.beginPath();

      return [o]; },
    planes(){ const y0=rnd(H*.15,H*.45), dur=rnd(6,8), o={t:0}; o.step=dt=>(o.t+=dt)<dur;
      o.draw=()=>{ const p=o.t/dur, x=-40+p*(W+80), y=y0+Math.sin(o.t*1.4)*34, dy=Math.cos(o.t*1.4)*34*1.4, ang=Math.atan2(dy,(W+80)/dur);
        ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.fillStyle='#f4f8fb'; ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-12,-8); ctx.lineTo(-6,0); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#c9d6de'; ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-12,7); ctx.lineTo(-6,0); ctx.closePath(); ctx.fill(); ctx.restore();
        ctx.strokeStyle='rgba(244,248,251,.25)'; ctx.setLineDash([3,6]); ctx.lineWidth=1; ctx.beginPath();
        for(let k=1;k<26;k++){ const tt=Math.max(0,o.t-k*.08), xx=-40+(tt/dur)*(W+80), yy=y0+Math.sin(tt*1.4)*34; k===1?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy); } ctx.stroke(); ctx.setLineDash([]); }; return [o]; },
    butterflies(){ const out=[]; for(let i=0;i<3;i++){ const y0=rnd(H*.2,H*.75), dur=rnd(7,10), c=pick(['#ffb3d1','#ffe17a','#b9a8ff','#9fe8c8']), d0=rnd(0,1.2), dir=Math.random()<.5?1:-1, o={t:-d0};
      o.step=dt=>(o.t+=dt)<dur;
      o.draw=()=>{ if(o.t<0) return; const p=o.t/dur, x= dir>0 ? -30+p*(W+60) : W+30-p*(W+60), y=y0+Math.sin(o.t*2.1)*40+Math.sin(o.t*5)*6, f=Math.abs(Math.sin(o.t*15));
        ctx.save(); ctx.translate(x,y); ctx.fillStyle=c;
        for(const s of [-1,1]){ ctx.save(); ctx.scale(s*(.25+.75*f),1); ctx.beginPath(); ctx.ellipse(6,-4,6,5,.4,0,TAU); ctx.fill(); ctx.beginPath(); ctx.ellipse(5,4,4,3.5,-.4,0,TAU); ctx.fill(); ctx.restore(); }
        ctx.fillStyle='#2a2238'; ctx.fillRect(-.8,-6,1.6,12); ctx.restore(); }; out.push(o); } return out; }
  };

  /* ===== engine ===== */
  function target(cfg){ return Math.round(Math.min(cfg.max,Math.max(cfg.max/3,W*H/cfg.div))); }
  function seed(){
    parts=[]; stars=[]; hills=[]; city=[]; live=[]; wind=0; if(!sc) return;
    if(sc.stars) for(let i=0,n=Math.round(W*H/7000);i<n;i++) stars.push({x:rnd(0,W),y:rnd(0,H*.7),r:rnd(.3,1.5),a:rnd(.4,1),sp:rnd(.8,2.6),ph:rnd(0,TAU)});
    hills=(sc.hills||[]).map(h=>{ const o={c:h.c,base:H*h.b,a:h.a,f:h.f,p:rnd(0,9),L:[]}; for(let i=0;i<(h.lights||0);i++) o.L.push({x:rnd(W*.08,W*.92),sp:rnd(.5,1.4),ph:rnd(0,TAU)}); return o; });
    clouds=[]; for(let i=0;i<(sc.clouds||0);i++) clouds.push({x:rnd(-W*.2,W),y:rnd(H*.05,H*.32),w:rnd(70,150),sp:rnd(4,10)});
    hills.forEach((h,i)=>{ const src=(sc.hills||[])[i]; h.pines=src&&src.pines; h.T=[]; if(h.pines){ let x=rnd(0,30); while(x<W+20){ h.T.push({x,h:rnd(18,38)}); x+=rnd(14,46); } } });
    if(sc.city){ let x=-10; while(x<W+10){ const w=rnd(22,58), h=rnd(H*.06,H*.2), win=[]; for(let yy=8;yy<h-6;yy+=9) for(let xx=5;xx<w-6;xx+=8) if(Math.random()<.35) win.push({x:xx,y:yy,sp:rnd(.05,.3),ph:rnd(0,TAU)}); city.push({x,w,h,win}); x+=w+rnd(1,6); } }
    sc.parts.forEach(cfg=>{ for(let i=0,n=target(cfg);i<n;i++) parts.push(make(cfg,false)); });
    events=sc.events.map(e=>({cfg:e,next:rnd(2,Math.min(8,e.every[0]))}));
  }
  function step(dt){
    if(sc.boat){ if(bite>0) bite=Math.max(0,bite-dt); else if((nextBite-=dt)<=0){ bite=1.2; nextBite=rnd(5,10); } }
    events.forEach(e=>{ e.next-=dt; if(e.next<=0){ live.push(...EV[e.cfg.k](e.cfg)); e.next=rnd(e.cfg.every[0],e.cfg.every[1]); } });
    live=live.filter(o=>o.step(dt));
    parts=parts.filter(p=>stepPart(p,dt));
    sc.parts.forEach(cfg=>{ const have=parts.reduce((n,p)=>n+(p.k===cfg.k),0), need=target(cfg); for(let i=have;i<need;i++) parts.push(make(cfg,true)); });
  }
  function draw(){
    ctx.clearRect(0,0,W,H); drawSky(); drawClouds(lastDt);
    live.forEach(o=>{ if(o.sky) o.draw(); });
    parts.forEach(p=>{ if(p.z<.45 && p.k!=='bat') drawPart(p); });
    drawGround();
    parts.forEach(p=>{ if(p.z>=.45 || p.k==='bat') drawPart(p); });
    live.forEach(o=>{ if(!o.sky) o.draw(); });
  }
  let lastDt=0;
  function frame(now){ const dt=Math.min(.05,(now-(last||now))/1000); last=now; lastDt=dt; clock+=dt; step(dt); draw(); raf=requestAnimationFrame(frame); }
  function stop(){ cancelAnimationFrame(raf); raf=0; last=0; }
  function start(){ stop(); if(!sc){ ctx.clearRect(0,0,W,H); return; } if(reduce.matches || document.hidden){ draw(); return; } raf=requestAnimationFrame(frame); }
  function size(){ dpr=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); seed(); }

  /* ===== palette ===== */
  const VARS={bg:'--bg',surface:'--surface',raised:'--raised',ink:'--ink',muted:'--muted',line:'--line',accent:'--accent',accentInk:'--accent-ink',accentSoft:'--accent-soft',
    save:'--save',saveSoft:'--save-soft',warn:'--warn',bad:'--bad',badSoft:'--bad-soft',good:'--good',track:'--track',hero:'--hero',heroInk:'--hero-ink',heroGlow:'--hero-glow',title:'--title'};
  function paint(p){
    Object.values(VARS).forEach(v=>root.style.removeProperty(v)); root.style.removeProperty('color-scheme');
    if(!p) return;
    if(p.scheme) root.style.setProperty('color-scheme',p.scheme);
    const full=Object.assign({raised:p.surface,saveSoft:p.accentSoft,warn:'#f2b05a',badSoft:'rgba(255,120,120,.16)',track:p.line},p);
    Object.entries(VARS).forEach(([k,v])=>{ if(full[k]) root.style.setProperty(v,full[k]); });
  }

  let pref='auto', tod='auto', night=null;
  try{ pref=localStorage.getItem('ledger.theme')||'auto'; tod=localStorage.getItem('ledger.tod')||'auto'; }catch(e){}
  if(pref!=='auto' && pref!=='default' && !T[pref]) pref='auto';
  if(!['auto','day','night'].includes(tod)) tod='auto';
  const isNight = d => { const h=d.getHours(); return h>=19 || h<8; }; // 7 PM to 8 AM
  function apply(){
    const now=new Date(), k = pref==='auto' ? autoTheme(now) : pref, t = T[k] || null;
    const n = tod==='auto' ? isNight(now) : tod==='night';
    if(t) root.setAttribute('data-holiday',k); else root.removeAttribute('data-holiday');
    root.setAttribute('data-tod', n?'night':'day');
    const pal = t ? t.pal : BASE;
    paint(n ? (t ? pal : null) : lightPal(Object.assign({},BASE,pal)));
    greet.hidden=!(t && t.greet); greet.textContent=t&&t.greet?t.greet:'';
    if(k!==theme || n!==night){ theme=k; night=n; sc=buildScene(t,n); seed(); }
    const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute('content', sc ? sc.sky[0] : (n?'#1a2123':lightPal(BASE).bg));
    start();
  }
  sel.innerHTML='<option value="auto">Automatic</option><option value="default">Everyday</option>'
    +'<optgroup label="Seasons">'+SEASONS.map(k=>`<option value="${k}">${T[k].label}</option>`).join('')+'</optgroup>'
    +'<optgroup label="Holidays">'+ORDER.map(k=>`<option value="${k}">${T[k].label}</option>`).join('')+'</optgroup>';
  sel.value=pref;
  sel.insertAdjacentHTML('afterend','<select id="tod-sel" aria-label="Day or night"><option value="auto">Day/night by time</option><option value="day">Always day</option><option value="night">Always night</option></select>');
  const todSel=document.getElementById('tod-sel'); todSel.value=tod;
  todSel.addEventListener('change',()=>{ tod=todSel.value; try{ localStorage.setItem('ledger.tod',tod); }catch(e){} apply(); });

  window.addEventListener('resize',()=>{ size(); start(); });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) stop(); else apply(); });
  if(reduce.addEventListener) reduce.addEventListener('change',start);
  setInterval(()=>{ if(!document.hidden && (pref==='auto'||tod==='auto')) apply(); },60000); // follow the clock: holiday weeks, seasons, day and night
  size(); apply();
})();
</script>

<script>
/* Tiny built-in PDF writer (text, lines, pages) so PDF export works with no internet. */
window.jspdf={jsPDF:function(){
  const W=612,H=792,pages=[[]];let cur=0,fam='helvetica',sty='normal',size=10,fill='0 0 0',stroke='0 0 0',lw=1;
  const FONT={helvetica:{normal:'F1',bold:'F2'},courier:{normal:'F3',bold:'F4'}};
  const col=(r,g,b)=>[r,g,b].map(v=>(v/255).toFixed(3)).join(' ');
  const hw=ch=>{ if(ch===' ')return .278; if("ijlI.,:;|!'".includes(ch))return .24; if('frt()-'.includes(ch))return .33;
    if('mwMW'.includes(ch))return .85; if(ch>='A'&&ch<='Z')return .67; if(ch>='0'&&ch<='9')return .556; return .5; };
  const width=t=>(fam==='courier'?String(t).length*.6:[...String(t)].reduce((a,ch)=>a+hw(ch),0)*(sty==='bold'?1.05:1))*size;
  const esc=t=>{let o='';for(const ch of String(t)){const c=ch.charCodeAt(0);
    if(ch==='('||ch===')'||ch==='\\')o+='\\'+ch;else if(c<32)o+=' ';else if(c<128)o+=ch;else if(c<256)o+='\\'+c.toString(8).padStart(3,'0');else o+='?';}return o;};
  return {
    internal:{pageSize:{getWidth:()=>W,getHeight:()=>H}},
    setFont(f,s){fam=FONT[f]?f:'helvetica';sty=s==='bold'?'bold':'normal';},
    setFontSize(s){size=s;}, setTextColor(r,g,b){fill=col(r,g,b);}, setDrawColor(r,g,b){stroke=col(r,g,b);}, setLineWidth(w){lw=w;},
    line(x1,y1,x2,y2){pages[cur].push(`${stroke} RG ${lw} w ${x1} ${(H-y1).toFixed(2)} m ${x2} ${(H-y2).toFixed(2)} l S`);},
    text(t,x,y,o={}){(Array.isArray(t)?t:[t]).forEach((ln,i)=>{let xx=x;const w=width(ln);
      if(o.align==='right')xx=x-w;else if(o.align==='center')xx=x-w/2;
      pages[cur].push(`BT /${FONT[fam][sty]} ${size} Tf ${fill} rg ${xx.toFixed(2)} ${(H-(y+i*(size+3))).toFixed(2)} Td (${esc(ln)}) Tj ET`);});},
    splitTextToSize(t,max){const out=[];let line='';String(t).split(' ').forEach(w=>{const test=line?line+' '+w:w;
      if(width(test)>max&&line){out.push(line);line=w;}else line=test;});out.push(line);return out;},
    addPage(){pages.push([]);cur=pages.length-1;}, getNumberOfPages(){return pages.length;}, setPage(n){cur=n-1;},
    output(){
      const objs=[],add=s=>(objs.push(s),objs.length);
      const cat=add(''),root=add('');
      const f=['Helvetica','Helvetica-Bold','Courier','Courier-Bold'].map(n=>add(`<< /Type /Font /Subtype /Type1 /BaseFont /${n} /Encoding /WinAnsiEncoding >>`));
      const kids=pages.map(p=>{const st=p.join('\n');const c=add(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`);
        return add(`<< /Type /Page /Parent ${root} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${f[0]} 0 R /F2 ${f[1]} 0 R /F3 ${f[2]} 0 R /F4 ${f[3]} 0 R >> >> /Contents ${c} 0 R >>`);});
      objs[cat-1]=`<< /Type /Catalog /Pages ${root} 0 R >>`;
      objs[root-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
      let out='%PDF-1.4\n';const offs=[];
      objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`;});
      const x=out.length;
      out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R >>\nstartxref\n${x}\n%%EOF`;
      const b=new Uint8Array(out.length);for(let i=0;i<out.length;i++)b[i]=out.charCodeAt(i)&255;return b.buffer;
    }
  };
}};
</script>
<script>
(function(){
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const fmt = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const money = n => fmt.format(Math.round((+n||0)*100)/100);
const signed = n => (n<0?'−':'+')+money(Math.abs(n));
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parseAmt = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isFinite(n) ? Math.round(n*100)/100 : 0; };
const sum = (arr,f) => arr.reduce((a,x)=>a+(+f(x)||0),0);
const key = n => String(n||'').trim().toLowerCase();
const r2 = n => Math.round((+n||0)*100)/100;
// Savings accounts live in History and are matched to This month's savings lines by name.
const findAcct = (st,name) => st.accounts.find(a=>key(a.name)===key(name));
function deposit(st,name,amt){ if(!key(name)) return; let a=findAcct(st,name); if(!a){ a={name:String(name).trim(),balance:0}; st.accounts.push(a); } a.balance=r2(a.balance+amt); }
function savingsNames(st){ const out=[], seen=new Set();
  st.accounts.map(a=>a.name).forEach(n=>{ const k=key(n); if(k && !seen.has(k)){ seen.add(k); out.push(String(n).trim()); } });
  return out; }
function ensureLeftover(st){ const names=savingsNames(st);
  if(st.leftoverTo && !names.some(n=>key(n)===key(st.leftoverTo))) st.leftoverTo=null;
  if(!st.leftoverTo && names.length) st.leftoverTo=names[0];
  if(st.spendLeftTo && !names.some(n=>key(n)===key(st.spendLeftTo))) st.spendLeftTo=null;
  if(!st.spendLeftTo && names.length) st.spendLeftTo=names[0]; }
const ymNow = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const ymNext = ym => { let [y,m]=ym.split('-').map(Number); m++; if(m>12){m=1;y++;} return y+'-'+String(m).padStart(2,'0'); };
const ymLabel = ym => { const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleString('en-US',{month:'long',year:'numeric'}); };
const stamp = at => { const d=new Date(at); return d.toLocaleString('en-US',{month:'short',day:'numeric'})+'<br>'+d.toLocaleString('en-US',{hour:'numeric',minute:'2-digit'}); };
const stampFlat = at => new Date(at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});

/* ---------- data model ---------- */
function blankMonth(month){
  return { v:2, month: month||ymNow(), takeHome:0, salary:0, monthlyBills:[], budgetedBills:[], savings:[], accounts:[], leftoverTo:null, spending:[], bigTx:[] };
}
// Accepts this version's shape or the first version's and returns this version's.
function normalize(s){
  const b = blankMonth(s && s.month);
  if(!s || typeof s!=='object') return b;
  if(s.v===2){
    b.takeHome=+s.takeHome||0; b.salary=+s.salary||0;
    b.monthlyBills=Array.isArray(s.monthlyBills)?s.monthlyBills:[];
    b.budgetedBills=(Array.isArray(s.budgetedBills)?s.budgetedBills:[]).map(x=>({...x,charges:Array.isArray(x.charges)?x.charges:[]}));
    b.savings=Array.isArray(s.savings)?s.savings:[];
    b.leftoverTo=s.leftoverTo||null;
    b.spendLeftTo=s.spendLeftTo||null;
    b.spending=Array.isArray(s.spending)?s.spending:[];
    b.bigTx=Array.isArray(s.bigTx)?s.bigTx:[];
    b.accounts=Array.isArray(s.accounts)?s.accounts.map(a=>({name:a.name,balance:+a.balance||0})):null;
  } else {
    b.takeHome = sum(s.income||[],x=>x.amount);
    b.monthlyBills = (s.bills||[]).map(x=>({id:x.id||uid(),label:x.label,amount:+x.amount||0,paid:!!x.paid}));
    b.spending = (s.spending||[]).map(x=>{ const c=(s.categories||[]).find(c=>c.id===x.catId);
      return {id:x.id||uid(),amount:+x.amount||0,dir:'out',note:x.note||(c?c.name:''),at:x.date?new Date(x.date+'T12:00').getTime():Date.now()}; });
  }
  if(!b.accounts){ // earlier versions kept balances on the savings lines themselves
    b.accounts=[];
    b.savings.forEach(x=>deposit(b,x.name,+x.balance||0));
    if(b.leftoverTo){ const l=b.savings.find(x=>x.id===b.leftoverTo); b.leftoverTo=l?l.name:null; }
    b.bigTx=b.bigTx.map(x=> x.account ? x : ({...x, account:(b.savings.find(v=>v.id===x.savingsId)||{}).name||'Deleted savings'}));
  }
  b.savings=b.savings.map(({balance,...x})=>x);
  b.savings.forEach(x=>{ if(key(x.name) && !findAcct(b,x.name)) b.accounts.push({name:String(x.name).trim(),balance:0}); });
  ensureLeftover(b);
  return b;
}
const actualOf = bb => sum(bb.charges,c=>c.amount);
function totals(s){
  const monthly = sum(s.monthlyBills,x=>x.amount);
  const budgeted = sum(s.budgetedBills,x=>x.budget);
  const charged = sum(s.budgetedBills,actualOf);
  const saved = sum(s.savings.filter(x=>!x.skip),x=>x.monthly);
  const subtotal = s.takeHome - monthly - budgeted - saved;
  const out = sum(s.spending.filter(x=>x.dir!=='in'),x=>x.amount);
  const back = sum(s.spending.filter(x=>x.dir==='in'),x=>x.amount);
  return { monthly, budgeted, charged, saved, subtotal, out, back, leftover: budgeted - charged, left: subtotal - out + back };
}

/* ---------- storage: private per-person db, local fallback ---------- */
let state = blankMonth();
let archives = [];
let store = null;
const LS_CUR='ledger.current', LS_ARC='ledger.archives';

function localStore(){
  return { kind:'local',
    async load(){
      try{ const c=localStorage.getItem(LS_CUR); if(c) state=JSON.parse(c);}catch(e){}
      try{ const a=localStorage.getItem(LS_ARC); if(a) archives=JSON.parse(a);}catch(e){}
    },
    async saveCurrent(){ try{localStorage.setItem(LS_CUR,JSON.stringify(state));}catch(e){} },
    async addArchive(rec){ archives.push(rec); try{localStorage.setItem(LS_ARC,JSON.stringify(archives));}catch(e){} }
  };
}
function dbStore(db,id){
  const col = db.collection('data/users/'+id);
  return { kind:'db',
    async load(){
      const snap = await col.get(); archives=[];
      snap.docs.forEach(d=>{ const v=d.data(); if(!v) return;
        const copy=JSON.parse(JSON.stringify(v)); // stored data arrives read-only; work on an editable copy
        if(d.id==='current') state=copy.state; else if(d.id.startsWith('m-')) archives.push(copy); });
    },
    async saveCurrent(){ await col.doc('current').set({state}); },
    async addArchive(rec){ await col.doc('m-'+rec.month+'-'+rec.archivedAt).set(rec); archives.push(rec); }
  };
}

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  if(!store) return;
  setStatus('Saving…');
  saveTimer=setTimeout(async()=>{
    try{ await store.saveCurrent(); setStatus(savedLine()); }
    catch(e){ setStatus('Couldn’t save just now. Your changes will be saved again on your next edit.'); }
  },400);
}
function savedLine(){ return 'Saved on this iPhone. Works offline.'; }
function setStatus(t){ $('#status').textContent=t; }
let toastT;
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2200); }

/* ---------- render: this month ---------- */
let confirming=false;
let setupOpen=true;
try{ setupOpen = localStorage.getItem('ledger.setupOpen')!=='0'; }catch(e){}

  const savingsRows = state.savings.map(s=>`

        <button class="x" data-del aria-label="Remove ${esc(s.name)}">X</button></div>
    </div>`).join('');

  ensureLeftover(state);
  const savingOptions = savingsNames(state).map(n=>`<option value="${esc(n)}" ${key(n)===key(state.leftoverTo)?'selected':''}>${esc(n)}</option>`).join('');

  const tx = [...state.spending].sort((a,b)=>b.at-a.at).map(x=>`
    <div class="row" data-list="spending" data-id="${x.id}">
      <span class="tx-date">${stamp(x.at)}</span>

      <span class="num tx-amt ${x.dir==='in'?'in':''}">${x.dir==='in'?'+':'−'}${money(x.amount)}</span>
      <button class="x" data-del aria-label="Delete this entry">X</button>
    </div>`).join('');

  $('#view-month').innerHTML = `
  <div class="stack">
    <div class="statement">
      <div class="top"><div><div class="eyebrow">Left to spend</div><div class="month-name">${ymLabel(state.month)}</div></div>
        <div class="left-big">${t.left<0?'−'+money(-t.left):money(t.left)}</div></div>
      <div class="equation">
        <div><span class="eyebrow">Subtotal</span><span class="num">${money(t.subtotal)}</span></div>
        <div><span class="eyebrow">− Spent</span><span class="num">${money(t.out)}</span></div>
        <div><span class="eyebrow">+ Back</span><span class="num">${money(t.back)}</span></div>
      </div>
    </div>

    <div class="setup">
    <button class="setup-toggle" id="setup-toggle" aria-expanded="${setupOpen}">
      <svg class="chev" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="setup-title">Income, bills &amp; savings</span>
      <span class="num setup-sum">${money(state.takeHome)} in · ${money(t.monthly+t.budgeted+t.saved)} out</span>
    </button>
    <div class="setup-body" ${setupOpen?'':'hidden'}>
    <section class="card">
      <div class="card-head"><h2>Income</h2></div>
      <div class="pay-main"><label for="take-home">Take-home pay</label>
        <input id="take-home" class="amt-in" inputmode="decimal" value="${(+state.takeHome).toFixed(2)}" data-top="takeHome"></div>
      <div class="pay-sub"><label for="salary">Monthly salary</label>
        <input id="salary" class="amt-in" inputmode="decimal" value="${(+state.salary).toFixed(2)}" data-top="salary"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>Bills</h2><span class="num">${money(t.monthly+t.budgeted)}</span></div>

      <h3 class="sub-head"><span>Monthly bills</span><span class="num">${money(t.monthly)}</span></h3>
      ${monthlyRows ? `<div class="rows">${monthlyRows}</div>` : `<p class="hint">Flat amounts that repeat every month, like rent or a phone plan.</p>`}
      <form class="add" data-add="monthlyBills">
        <input id="mb-label" class="grow" placeholder="Bill, e.g. Rent" required aria-label="Monthly bill name">
        <input id="mb-amt" class="money" inputmode="decimal" placeholder="0.00" required aria-label="Monthly bill amount">
        <button class="btn">Add</button>
      </form>

      <div class="divider"></div>
      <h3 class="sub-head"><span>Budgeted bills</span><span class="num">${money(t.budgeted)}</span></h3>
      ${budgetedRows ? `<div>${budgetedRows}</div>` : `<p class="hint">Set aside an amount for bills that change each month, like utilities. Log the actual charges; whatever you don’t use goes to savings when you start a new month.</p>`}
      ${state.budgetedBills.length ? (state.leftoverTo
        ? `<div class="leftover-to"><label for="leftover-to">Leftovers go to</label><select id="leftover-to">${savingOptions}</select><span class="num ${t.leftover<0?'neg':'pos'}">${signed(t.leftover)}</span></div>`
        : `<p class="hint">Create a savings account in History to collect what’s left over.</p>`) : ''}
      <form class="add" data-add="budgetedBills">
        <input id="bb-label" class="grow" placeholder="Bill, e.g. Utilities" required aria-label="Budgeted bill name">
        <input id="bb-amt" class="money" inputmode="decimal" placeholder="Budget" required aria-label="Budgeted amount">
        <button class="btn">Add</button>
      </form>
    </section>

    <section class="card">
      <div class="card-head"><h2>Savings deposits</h2><span class="num">${money(t.saved)} / month</span></div>

      ${state.accounts.length ? `<form class="add" data-add="savings">
        <select id="sv-acct" class="grow" aria-label="Savings account">${state.accounts.map(a=>`<option value="${esc(a.name)}">${esc(a.name)}</option>`).join('')}</select>
        <input id="sv-amt" class="money" inputmode="decimal" placeholder="Monthly" aria-label="Monthly deposit amount">

    <div class="subtotal">

      <div class="kv muted"><span>− Budgeted bills</span><span class="num">${money(t.budgeted)}</span></div>
      <div class="kv muted"><span>− Savings deposits</span><span class="num">${money(t.saved)}</span></div>
      <div class="kv expense"><span>Total expense</span><span class="num">${money(t.monthly+t.budgeted+t.saved)}</span></div>
      <div class="kv total"><span>Subtotal</span><span class="num ${t.subtotal<0?'neg':''}">${t.subtotal<0?'−'+money(-t.subtotal):money(t.subtotal)}</span></div>

    <section class="card">
      <div class="card-head"><h2>Spending log</h2><span class="num">${state.spending.length} ${state.spending.length===1?'entry':'entries'}</span></div>

    </div>
  </div>`;

/* ---------- render: history ---------- */
let bigOpen=false;
let editingAcct=null, lastTap={k:null,at:0};
function renameAccount(oldName,newName){
  newName=newName.trim();
  if(!newName){ toast('Type a name for the account'); return false; }
  if(key(newName)!==key(oldName) && findAcct(state,newName)){ toast('You already have an account named '+findAcct(state,newName).name); return false; }
  const a=findAcct(state,oldName); if(!a) return true;
  a.name=newName;
  state.savings.forEach(x=>{ if(key(x.name)===key(oldName)) x.name=newName; });
  state.bigTx.forEach(x=>{ if(key(x.account)===key(oldName)) x.account=newName; });
  if(key(state.leftoverTo)===key(oldName)) state.leftoverTo=newName;
  if(key(state.spendLeftTo)===key(oldName)) state.spendLeftTo=newName;
  return true;
}
function renderSavingsPanel(){
  const t=totals(state);
  ensureLeftover(state);
  const names=savingsNames(state);
  const total=sum(state.accounts,x=>x.balance);
  const pending = n => sum(state.savings.filter(x=>!x.skip && key(x.name)===key(n)),x=>x.monthly) + (state.budgetedBills.length && key(n)===key(state.leftoverTo)?t.leftover:0) + (key(n)===key(state.spendLeftTo)?t.left:0);
  const rows = names.map(n=>{ const p=pending(n), a=findAcct(state,n);
    if(editingAcct && key(n)===editingAcct) return `<form class="acct-edit" data-rename="${esc(n)}">
        <input id="acct-edit" value="${esc(n)}" aria-label="Account name" autocomplete="off">
        <button class="btn sm">Save</button><button type="button" class="btn sm ghost" id="acct-cancel">Cancel</button></form>`;
    return `<div class="kv acct-row" data-acct="${esc(n)}" title="Double-tap to rename"><span>${esc(n)}${p?`<span class="pend num">${signed(p)} when ${ymLabel(state.month)} closes</span>`:''}</span><span class="num">${money(a?a.balance:0)}</span></div>`; }).join('');
  const opts = names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');

  return `<section class="card">
    <div class="card-head"><h2>Savings</h2>
      <button class="plus" id="big-toggle" aria-expanded="${bigOpen}" aria-label="${bigOpen?'Close':'New'} large transaction">${bigOpen?'X':'+'}</button></div>
    ${rows ? `<div>${rows}<div class="kv total"><span>Total saved</span><span class="num">${money(total)}</span></div></div>`
           : `<p class="hint">No savings accounts yet. Create one below, like Emergency fund or Vacation.</p>`}
    <form class="add" data-add="account">
      <input id="acct-name" class="grow" placeholder="New account, e.g. Emergency fund" aria-label="New savings account name">
      <button class="btn">Create account</button>
    </form>
    ${bigOpen ? (names.length ? `<form class="big-form" data-add="bigTx">
        <h3 class="sub-head"><span>Large transaction</span><span>${new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span></h3>
        <div class="add tight">
          <input id="big-amt" class="money" inputmode="decimal" placeholder="0.00" required aria-label="Amount">
          <select id="big-sv" class="grow" aria-label="Savings">${opts}</select>
          <input id="big-note" class="grow" placeholder="Note, e.g. Car repair" aria-label="Note" style="flex-basis:100%">
          <button class="btn" value="in">Add to savings</button>
          <button class="btn back" value="out">Take out</button>
        </div></form>` : `<p class="hint">Create a savings account first, then log large transactions against it.</p>`) : ''}
    ${!bigOpen && names.length ? `<p class="hint">Tap + to log a large transaction, like a bonus or a big purchase. It appears in Past months on the day you log it.</p>` : ''}
  </section>`;
}
function renderHistory(){
  const panel=renderSavingsPanel();
  const bigCard = x=>`<div class="big-item" data-big="${x.id}">

        ${s.budgetedBills.length?`<div><h3>Budgeted bills</h3>${s.budgetedBills.map(b=>kv(esc(b.label)+` <span style="color:var(--muted)">budget ${money(b.budget)}</span>`,'paid '+money(actualOf(b)))).join('')}
          ${kv('Left over'+(leftTo?' → '+esc(leftTo):''),signed(t.leftover))}</div>`:''}
        ${s.savings.length?`<div><h3>Savings</h3>${s.savings.map(x=>kv(esc(x.name),(x.skip?'skipped':signed(+x.monthly||0)))).join('')}</div>`:''}

      </div></details>`;
  }).join('')+`</div>`;
}

/* ---------- files: share sheet on iPhone, download elsewhere ---------- */
async function saveFile(name,data,type){
  const file=new File([data],name,{type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return 'shared'; }
    catch(e){ if(e && e.name==='AbortError') return 'cancelled'; }
  }
  const url=URL.createObjectURL(file), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  return 'downloaded';
}

function buildPdf(){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({unit:'pt',format:'letter'});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=54, R_=W-M;
  const INK=[26,33,35], MUTED=[110,106,116], ACC=[68,69,86], RULE=[210,200,204];
  let y=M;
  const pdfMoney = n => { const v=r2(n); return (v<0?'-':'')+fmt.format(Math.abs(v)); };
  const pdfSigned = n => (n<0?'-':'+')+fmt.format(Math.abs(r2(n)));
  const clean = t => String(t??'').replace(/[−]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x00-\xFF]/g,'');
  const need = h => { if(y+h>H-M){ doc.addPage(); y=M; } };
  const rule = (c=RULE,w=.6) => { doc.setDrawColor(...c); doc.setLineWidth(w); doc.line(M,y,R_,y); };
  function h1(t){ need(40); doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...INK); doc.text(clean(t),M,y+12); y+=20; rule(ACC,1.2); y+=12; }
  function h2(t){ need(30); doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...MUTED); doc.text(clean(t).toUpperCase(),M,y+8); y+=16; }
  function row(left,right,opts={}){
    const size=opts.size||10; doc.setFontSize(size); doc.setFont('helvetica',opts.bold?'bold':'normal');
    const lines=doc.splitTextToSize(clean(left), (R_-M)-120);
    const h=lines.length*(size+3)+3; need(h);
    if(opts.rule){ rule(); y+=6; }
    doc.setTextColor(...(opts.muted?MUTED:INK)); doc.text(lines,M+(opts.indent||0),y+size);
    doc.setFont('courier',opts.bold?'bold':'normal'); doc.text(clean(right),R_,y+size,{align:'right'});
    y+=h;
  }
  const gap = (n=10) => { y+=n; };

  // cover line
  doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.setTextColor(...INK); doc.text('Monthly Ledger',M,y+18); y+=28;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...MUTED);
  doc.text('Exported '+new Date().toLocaleString('en-US',{month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}),M,y+8); y+=26;

  if(exportSel.accounts){
    h1('Savings accounts');
    if(!state.accounts.length) row('No savings accounts','',{muted:true});
    state.accounts.forEach(a=>row(a.name,pdfMoney(a.balance)));
    row('Total saved',pdfMoney(sum(state.accounts,x=>x.balance)),{bold:true,rule:true});
    gap(18);
  }
  if(exportSel.big){
    h1('Large transactions');
    const list=[...state.bigTx].sort((a,b)=>a.at-b.at);
    if(!list.length) row('No large transactions','',{muted:true});
    list.forEach(x=>row(stampFlat(x.at)+'   '+(x.note||'Large transaction')+'  ('+x.account+')',pdfSigned(x.amount)));
    if(list.length) row('Net',pdfSigned(sum(list,x=>x.amount)),{bold:true,rule:true});
    gap(18);
  }
  sortedArchives().filter(monthChecked).forEach(r=>{
    const s=normalize(r.state), t=totals(s);
    h1(ymLabel(s.month));
    h2('Income'); row('Take-home pay',pdfMoney(s.takeHome)); if(s.salary) row('Monthly salary',pdfMoney(s.salary),{muted:true}); gap(6);
    if(s.monthlyBills.length){ h2('Monthly bills'); s.monthlyBills.forEach(x=>row(x.label+(x.paid?'':' (unpaid)'),pdfMoney(x.amount))); gap(6); }
    if(s.budgetedBills.length){ h2('Budgeted bills');
      s.budgetedBills.forEach(b=>{ row(b.label+'  - budget '+pdfMoney(b.budget),'paid '+pdfMoney(actualOf(b)));
        b.charges.forEach(c=>row(c.note||'Charge',pdfMoney(c.amount),{muted:true,indent:14,size:9})); });
      row('Left over'+(s.leftoverTo?' to '+s.leftoverTo:''),pdfSigned(t.leftover),{muted:true}); gap(6); }
    if(s.savings.length){ h2('Savings deposits'); s.savings.forEach(x=>row(x.name,x.skip?'skipped':pdfMoney(x.monthly))); gap(6); }
    h2('Summary');
    row('Total expense',pdfMoney(t.monthly+t.budgeted+t.saved));
    row('Subtotal',pdfMoney(t.subtotal),{bold:true});
    row('Spent',pdfMoney(-t.out)); row('Got back',pdfSigned(t.back));
    row('Left to spend'+(s.spendLeftTo?' to '+s.spendLeftTo:''),pdfMoney(t.left),{bold:true,rule:true}); gap(6);
    if(s.spending.length){ h2('Spending log');
      [...s.spending].sort((a,b)=>a.at-b.at).forEach(x=>row(stampFlat(x.at)+'   '+(x.note||(x.dir==='in'?'Money back':'Spent')),(x.dir==='in'?'+':'-')+fmt.format(x.amount),{size:9.5})); }
    gap(22);
  });
  // page numbers
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUTED); doc.text('Monthly Ledger  ·  page '+i+' of '+n,W/2,H-28,{align:'center'}); }
  return doc.output('arraybuffer');
}

async function makePdf(){
  if(exporting) return; exporting=true; renderHistory();
  try{
    const data=buildPdf();
    const months=sortedArchives().filter(monthChecked);
    const name='Monthly Ledger'+(months.length===1?' '+ymLabel(months[0].month):'')+' '+(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))(new Date())+'.pdf';
    const how=await saveFile(name,data,'application/pdf');
    if(how!=='cancelled') toast('PDF ready');
  }catch(err){ toast('Couldn’t make the PDF. Try again.'); }finally{ exporting=false; renderHistory(); }
}

async function startNewMonth(){
  const t=totals(state);
  const rec={ month: state.month, archivedAt: Date.now(), state: JSON.parse(JSON.stringify(state)) };
  const next={ accounts: state.accounts.map(a=>({...a})) };
  state.savings.forEach(x=>{ if(!x.skip) deposit(next,x.name,+x.monthly||0); });
  if(state.budgetedBills.length && state.leftoverTo) deposit(next,state.leftoverTo,t.leftover);
  if(state.spendLeftTo) deposit(next,state.spendLeftTo,t.left);
  try{
    clearTimeout(saveTimer);
    await store.addArchive(rec);
    state={ v:2, month: ymNext(state.month), takeHome: state.takeHome, salary: state.salary,
      monthlyBills: state.monthlyBills.map(x=>({...x,paid:false})),
      budgetedBills: state.budgetedBills.map(x=>({...x,charges:[]})),
      savings: state.savings.map(s=>({...s, skip:false})),
      accounts: next.accounts,
      leftoverTo: state.leftoverTo, spendLeftTo: state.spendLeftTo, spending: [], bigTx: state.bigTx };
    await store.saveCurrent();
    confirming=false; openBills.clear(); render(); setStatus(savedLine());
    toast(ymLabel(rec.month)+' saved to History');
    window.scrollTo({top:0});
  }catch(err){
    confirming=false; renderMonth();
    setStatus('Couldn’t archive the month. Check your connection and try again; nothing was cleared.');
  }
}

  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  state=normalize(state);
  render(); setStatus(savedLine());
  try{ if(sessionStorage.getItem('ledger.tab')==='history') showTab('history'); }catch(e){}
})();
})();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
